name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Спрацьовує при пуші в гілку main

  # Дозволяє запускати збірку вручну у вкладці Actions
  workflow_dispatch:

# Встановлюємо права для токена GITHUB_TOKEN, щоб дозволити деплой на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяємо лише один активний деплой одночасно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # За стандартом Vite збирає все в папку dist
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
